<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;background:#fff;color:#17201c;font-family:"PingFang SC",sans-serif}main{height:100%;padding:54px 70px}header{font-size:24px;color:#536159}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}.metric{border:1px solid #cfd8d3;padding:32px}.metric b{display:block;font-size:54px;color:#176b4a}.metric span{font-size:23px}.callout{margin-top:22px;padding:22px;background:#e9f5ee;font-size:28px}h1{font-size:42px;letter-spacing:0}</style><main><header>Activation Review · 视觉指标练习</header><h1 id="title"></h1><div class="grid" id="grid"></div><div class="callout" id="callout"></div></main><script>
const slides=[
["增长不等于健康",[["1,800","新增用户"],["41%","激活率 ↓21pp"]],"同时观察规模与转化"],
["激活漏斗",[["90%","完成注册"],["55%","导入数据"],["43%","首份报告"],["-35pp","最大流失"]],"优先研究数据导入"],
["渠道质量",[["38%","自然搜索留存"],["12%","广告留存"],["51%","客户推荐留存"]],"数量最大 ≠ 质量最高"],
["导入向导实验",[["74%","任务完成率"],["2m10s","中位耗时"],["n=60","当前样本"]],"方向积极，仍需扩大样本"],
["行动决策",[["PAUSE","扩大广告"],["FIX","数据导入"],["KEEP","客户推荐"],["2 WEEKS","复查指标"]],"把规模、转化、留存与样本量放在一起"]];
const s=slides[Number(new URLSearchParams(location.search).get("slide")||0)]||slides[0];title.textContent=s[0];grid.innerHTML=s[1].map(x=>`<div class=metric><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');callout.textContent=s[2];</script></html>
